# Only immutable build assets and public image transformations use shared caching.
proxy_cache_path /var/cache/nginx/storefront levels=1:2 keys_zone=storefront_assets:10m
                 max_size=512m inactive=7d use_temp_path=off;

# Keep browser caching while the storefront password gate is enabled.
# Shared asset caching happens here, after Nginx authenticates each request.
map $uri $asset_browser_cache {
  default "private, max-age=3600";
  ~^/_nuxt/ "private, max-age=31536000, immutable";
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Preserve the public scheme supplied by the trusted edge proxy. Falling back
# to the internal connection scheme keeps local health checks deterministic.
map $http_x_forwarded_proto $upstream_x_forwarded_proto {
  https   https;
  http    http;
  default $scheme;
}

# Redirect every non-canonical hostname (including www) to the HTTPS apex.
# The Apple Pay association file is deliberately served directly with no
# redirect because Apple domain verification requires an exact 200 response.
server {
  listen 80 default_server;
  server_name www.avinaq.com _;

  location = /.well-known/apple-developer-merchantid-domain-association {
    root /var/www;
    default_type application/octet-stream;
    try_files $uri =404;
  }

  location / {
    return 308 https://avinaq.com$request_uri;
  }
}

server {
  listen 80;
  server_name avinaq.com;

  client_max_body_size 20m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location ~ ^/(?:_nuxt|_ipx)/ {
    # The same site password gate applies before serving a cache hit.
    auth_basic "Avinaq private site";
    auth_basic_user_file /tmp/avinaq.htpasswd;
    proxy_pass http://nuxt-ui-app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
    proxy_set_header Connection "";
    proxy_cache storefront_assets;
    proxy_cache_key "$host$request_uri";
    proxy_cache_valid 200 1h;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $asset_browser_cache;
    add_header X-Asset-Cache $upstream_cache_status always;
  }

  location = /.well-known/apple-developer-merchantid-domain-association {
    root /var/www;
    default_type application/octet-stream;
    try_files $uri =404;
  }

  location / {
    # Keep the storefront private while allowing the exact Apple Pay
    # association location above to remain publicly verifiable.
    auth_basic "Avinaq private site";
    auth_basic_user_file /tmp/avinaq.htpasswd;

    proxy_pass         http://nuxt-ui-app:3000;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Proto $upstream_x_forwarded_proto;

    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;

    proxy_connect_timeout 30s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    send_timeout          60s;
  }
}
