services:
  nuxt-ui-app:
    build:
      context: ./nuxt-app
      dockerfile: ../docker/prod/nuxt.dockerfile
    container_name: nuxt-ui-app
    restart: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_BASE: https://app.avinaq.com
    networks:
      - npm_network
   

  nginx:
    image: nginx:alpine
    container_name: nuxt-ui-nginx-prod
    volumes:
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - nuxt-ui-app
    networks:
      - npm_network

networks:
  npm_network:
    external: true
