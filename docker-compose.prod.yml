services:
  nuxt-ui-app:
    build:
      context: ./nuxt-app
      dockerfile: ../docker/prod/nuxt.dockerfile
    container_name: nuxt-ui-app
    restart: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_BASE: https://app.avinaq.com
      NUXT_PUBLIC_UPLOADS_URL: https://app.avinaq.com/storage
      NUXT_PUBLIC_R2_URL: https://app.avinaq.com/storage
      NUXT_PUBLIC_SITE_URL: https://avinaq.com
    networks:
      - proxy_network
   

  nginx:
    image: nginx:alpine
    container_name: nuxt-ui-nginx-prod
    # The host source remains owner-only. Prepare a worker-readable copy
    # inside the container before Nginx starts its unprivileged workers.
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        cp /etc/nginx/avinaq.htpasswd /tmp/avinaq.htpasswd
        chown 101:101 /tmp/avinaq.htpasswd
        chmod 0400 /tmp/avinaq.htpasswd
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    volumes:
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nuxt-app/public/.well-known:/var/www/.well-known:ro
      # This credential file exists only on the VPS; never add it to Git.
      - /home/abdallah/.secrets/avinaq.htpasswd:/etc/nginx/avinaq.htpasswd:ro
    depends_on:
      - nuxt-ui-app
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
